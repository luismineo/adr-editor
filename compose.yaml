name: adr-editor

services:
  app:
    build: .
    image: adr-editor:latest
    init: true
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
    # The server only answers requests addressed to localhost:<PORT>, so the host
    # and container ports must match. Bound to 127.0.0.1 to keep the editor local.
    ports:
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'
    volumes:
      - adr-data:/app/data

volumes:
  adr-data:
